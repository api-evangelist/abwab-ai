name: Abwab Ai
description: >-
  Abwab.ai is an AI-powered credit intelligence platform for MSME (micro, small,
  and medium enterprise) lending, used by banks, NBFIs, fintechs, funds, and
  digital platforms to originate loans, assess credit risk, price, and monitor
  MSME loan portfolios across the full lending lifecycle. The platform combines
  rules and AI models for real-time credit decisioning, agentic credit
  intelligence that surfaces leads and flags portfolio risk, and embedded
  financing for existing SME platforms. It is API-first, plugging into existing
  loan-origination and core-banking systems without core replacement, with a
  versioned REST API (api.abwab.ai), webhook notifications, and Python/Node.js
  SDKs in development. Abwab is focused on the Saudi Arabian market with
  in-Kingdom data residency and alignment to the SAMA Cybersecurity Framework,
  PDPL, and Sharia-compliant lending (used by Kafalah). Backed by Speedinvest.
